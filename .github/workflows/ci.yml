name: CI

# Runs the same two commands docs/HANDOFF.md §4 names for local verification, on a
# GitHub-hosted Apple-silicon runner with the newest Xcode 26.x the image carries. The
# project is macOS-only (`.macOS(.v26)`), so there is no Linux job to have.

on:
  pull_request:
  push:
    branches: [main]

# Least privilege. A job that needs more should raise it on that job alone, never here.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are pointless; every push to main gets a complete run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: core tests
    runs-on: macos-26
    # A stalled job blocks every PR, and a hung `swift test` reports nothing until
    # someone notices and cancels it — #28 burned twelve and ten minutes that way. The
    # root cause is fixed (blocking work no longer runs on the cooperative pool; see
    # `BlockingWork`), so this is the backstop, not the fix: the suite is ~10 s locally
    # and ~2 min here, so anything past ten minutes is a hang, and a hang should fail.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-xcode
      # 477 tests, 36 suites. Benchmarks are gated on LIGHTBOX_BENCH=1 and skip here.
      - name: swift test
        working-directory: Core
        run: swift test

  app:
    name: app tests
    runs-on: macos-26
    # Same backstop as above.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-xcode
      # Builds the SwiftUI target and runs its 63 tests. Unsigned by design
      # (CODE_SIGNING_ALLOWED=NO is in the project); nothing here needs a certificate.
      - name: xcodebuild test
        working-directory: App
        run: xcodebuild -scheme Lightbox -destination 'platform=macOS' test
